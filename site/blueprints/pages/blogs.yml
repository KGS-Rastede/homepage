title: Blogs aus allen Fächern (Übersicht)
num: '{{ page.date.toDate("YmdHi") }}'
icon: 📖

options:
  '*': true


sections:
  content:
    type: fields
    fields:
      heading:
        type: text
        label: Untertitel

  drafts:
    headline: noch nicht öffentlich
    type: pages
    layout: table
    columns:
      date:
        label: Datum
        type: date
        display: DD.MM.YYYY
        width: 1/6
      tags:
        label: Tags
        type: tags
        width: 2/6
    status: draft
    template:
      - blogartikel
    sortBy: date desc
    search: true


  published:
    headline: öffentlich einsehbar
    type: pages
    status: listed
    templates:
      - blogartikel
    sortBy: date desc
    search: true
    info: "Autor: {{page.author}}, Datum: {{page.date.toDate('d.m.Y') }}, Tag: {{page.tags}}"

  unpublished:
    headline: NICHT öffentlich einsehbar
    type: pages
    layout: table
    columns:
      date:
        label: Datum
        type: date
        display: DD.MM.YYYY
        width: 1/6
      tags:
        label: Tags
        type: tags
        width: 2/6
    status: unlisted
    templates:
      - blogartikel
    sortBy: date desc
    search: true


