title: Fachseite / Informationen zum Fach
num: '{{ page.date.toDate("Ymd") }}'
icon: 📖

options:
  update:
    '*': false
    fachleiter: true
    schulleitung: true
    admin: true

columns:
  main:
    width: 2/3
    sections:
      content:
        type: fields
        fields:
          heading:
            type: text
            label: Untertitel
          text: fields/inhalt

  sidebar:
    width: 1/3
    sticky: true
    sections:
      meta:
        type: fields
        fields:
          haupttag:
            label: Tag für Blogeintrag
            help: Dieser Begriff (i.d.R. der Name des Fachs) muss als 'Tag' verwendet werden, damit ein Blogeintrag auch gefunden wird
            type: text
          sidebar: fields/seitenleiste
