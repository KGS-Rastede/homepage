title: Fachseite / Informationen zum Fach 
num: '{{ page.date.toDate("Ymd") }}'
icon: 📖

options:
  update:
    *: false
    fachleiter: true
    schulleitung: true
    admin: true


heading:
  type: text
  label: Untertitel

columns:
  main:
    width: 2/3
    sections:
      content:
        type: fields
        fields:
          heading:
            type: text
            label: Untertitel
          text:
            label: Inhalt
            type: blocks
            fieldsets:
              - heading
              - text
              - list
              - image
              - gallery
              - video
              - local-video
              - code
              - markdown
              - audio
              - horizontale-linie
              - tabelle
              - quote
              - karousel

          gallery:
            type: files
            uploads: blogbild
            query: page.images
            label: Bilder zum Fach
            uploads: blogbild
            query: page.images
            label: Bilder zum Fach
            layout: cards
            image:
              cover: true
              ratio: 1/1
          line:
            type: line
          lehrplantext:
            label: Infos zu den Lehrplänen
            type: textarea
          lehrplaene:
            label: Lehrpläne
            type: files
            uploads: lehrplandatei
            
  sidebar:
    width: 1/3
    sticky: true
    sections:
      meta:
        meta:
        type: fields
        fields:
          haupttag:
            label: Tag für Blogeintrag
            help: Dieser Begriff (i.d.R. der Name des Fachs) muss als 'Tag' verwendet werden, damit ein Blogeintrag auch gefunden wird
            type: text
          hintergrundbild:
            label: Hintergrundbild
            uploads: hintergrundbild
            query: page.images
            type: files
            layout: cards
            max: 1
            multiple: false
            help: Dieses Bild wird oben auf der Seite als Hintergrundbild dargestellt
          fotoansicht:
            label: Fotos anzeigen
            type: select
            default: gallery
            help: Karousel und Galerie sind automatische Darstellungen der Bilder. Wird 'manuel' ausgewählt müssen die Bilder per Hand eingebunden werden.
            options:
              carousel: Karousel
              gallery: Galerie
              manuel: Manuell einbinden
                toggle:
          sidebar: fields/seitenleiste
