# Inhalt einer Seite: Layout mit Spalten, in den Spalten Blöcke.
#
# Einbinden im Seiten-Blueprint:   text: fields/inhalt
# Ausgeben im Template:            snippet('inhalt')
#
# Seiten, die noch reine Blöcke gespeichert haben (früher `type: blocks`),
# zeigt Kirby automatisch als ein Layout mit einer Spalte an, im Panel und
# im Frontend. Beim nächsten Speichern im Panel wird daraus ein Layout.
# Der Content muss also nicht umgewandelt werden.
#
# Neue Block-Typen nur hier eintragen, dann gibt es sie auf allen Seiten,
# die dieses Feld benutzen.

label: Inhalt
type: layout
layouts:
  - '1/1'
  - '1/2, 1/2'
  - '2/3, 1/3'
  - '1/3, 2/3'
  - '1/3, 1/3, 1/3'
fieldsets:
  texte:
    label: Text
    type: group
    fieldsets:
      - heading
      - text
      - list
      - quote
      - highlightfeld
      - accordion
      - markdown
      - code
  medien:
    label: Bilder und Medien
    type: group
    fieldsets:
      - image
      - gallery
      - karousel
      - video
      - local-video
      - audio
  sonstiges:
    label: Verweise und Gestaltung
    type: group
    fieldsets:
      - button
      - lesensieauch
      - gastautor
      - horizontale-linie
